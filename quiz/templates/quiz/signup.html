<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1d4ed8 0%, #0ea5e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0;
        }
        .auth-card {
            width: 100%;
            max-width: 460px;
            border-radius: 16px;
            border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
        }
        .auth-brand {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }
        .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 .2rem rgba(37,99,235,.2); }
        .btn-success-custom { background: #059669; border-color: #059669; color: #fff; }
        .btn-success-custom:hover { background: #047857; border-color: #047857; color: #fff; }
        .pass-toggle { cursor: pointer; }
    </style>
</head>
<body>
<div class="container px-3">
    <div class="card auth-card mx-auto">
        <div class="card-body p-4 p-sm-5">
            <div class="auth-brand">
                <i class="bi bi-person-plus-fill text-white fs-4"></i>
            </div>
            <h4 class="text-center fw-bold mb-1">Ro'yxatdan o'tish</h4>
            <p class="text-center text-muted small mb-4">Yangi hisob yarating</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} py-2 small">
                        <i class="bi bi-exclamation-circle me-1"></i>{{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" autocomplete="off">
                {% csrf_token %}
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-medium small">Ism</label>
                        <input type="text" name="firstname" class="form-control" placeholder="Ism" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-medium small">Familiya</label>
                        <input type="text" name="lastname" class="form-control" placeholder="Familiya" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small">Foydalanuvchi nomi</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-at text-muted"></i>
                        </span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0"
                               placeholder="3–20 ta belgi, lotin, raqam, _" required>
                    </div>
                    <div class="form-text">Faqat lotin harflari, raqamlar va "_" belgisi</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small">Email <span class="text-muted">(ixtiyoriy)</span></label>
                    <input type="email" name="email" class="form-control" placeholder="email@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small">Parol</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" name="password1" id="pass1"
                               class="form-control border-start-0 border-end-0 ps-0"
                               placeholder="••••••••" required>
                        <span class="input-group-text bg-light border-start-0 pass-toggle"
                              onclick="togglePass('pass1', this)">
                            <i class="bi bi-eye text-muted"></i>
                        </span>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium small">Parolni takrorlang</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock-fill text-muted"></i>
                        </span>
                        <input type="password" name="password2" id="pass2"
                               class="form-control border-start-0 border-end-0 ps-0"
                               placeholder="••••••••" required>
                        <span class="input-group-text bg-light border-start-0 pass-toggle"
                              onclick="togglePass('pass2', this)">
                            <i class="bi bi-eye text-muted"></i>
                        </span>
                    </div>
                </div>
                <button class="btn btn-success-custom w-100 fw-semibold py-2" type="submit">
                    <i class="bi bi-check-circle me-2"></i>Ro'yxatdan o'tish
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted small mb-0">
                Allaqachon hisobingiz bormi?
                <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none">Kirish</a>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePass(id, el) {
    const input = document.getElementById(id);
    const icon = el.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash text-muted';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye text-muted';
    }
}
</script>
</body>
</html>
