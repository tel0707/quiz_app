<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1d4ed8 0%, #0ea5e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
        }
        .auth-brand {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }
        .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 .2rem rgba(37,99,235,.2); }
        .btn-primary { background: #2563eb; border-color: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
        .pass-toggle { cursor: pointer; }
    </style>
</head>
<body>
<div class="container px-3">
    <div class="card auth-card mx-auto">
        <div class="card-body p-4 p-sm-5">
            <div class="auth-brand">
                <i class="bi bi-mortarboard-fill text-white fs-4"></i>
            </div>
            <h4 class="text-center fw-bold mb-1">Tizimga kirish</h4>
            <p class="text-center text-muted small mb-4">Hisobingizga kiring</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} py-2 small">
                        <i class="bi bi-exclamation-circle me-1"></i>{{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" autocomplete="on">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-medium small">Foydalanuvchi nomi</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0"
                               placeholder="username" required autofocus autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium small">Parol</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" name="password" id="loginPass"
                               class="form-control border-start-0 border-end-0 ps-0"
                               placeholder="••••••••" required autocomplete="current-password">
                        <span class="input-group-text bg-light border-start-0 pass-toggle"
                              onclick="togglePass('loginPass', this)">
                            <i class="bi bi-eye text-muted"></i>
                        </span>
                    </div>
                </div>
                <button class="btn btn-primary w-100 fw-semibold py-2" type="submit">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Kirish
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted small mb-0">
                Hisobingiz yo'qmi?
                <a href="{% url 'signup' %}" class="text-primary fw-semibold text-decoration-none">
                    Ro'yxatdan o'ting
                </a>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePass(id, el) {
    const input = document.getElementById(id);
    const icon = el.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash text-muted';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye text-muted';
    }
}
</script>
</body>
</html>
